name: 问题反馈
description: 报告组织社区文档或默认模板中的缺陷
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题是什么
      description: 用一句话说清现象，再补充细节；客户端或服务端问题请提交到对应项目仓库。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 说明触发问题的页面、链接或命令。
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 内容里没有真实账号、密码、Token 或他人个人信息
          required: true
        - label: 这不是安全问题（安全问题走 SECURITY.md）
          required: true
